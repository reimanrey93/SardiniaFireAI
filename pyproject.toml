
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sardinia-fire-ai"
version = "0.1.0"
description = "Multi-sensor wildfire event reconstruction and benchmarking in Sardinia"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "hdbscan>=0.8.33",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "scipy>=1.11"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "torch>=2.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
